<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giveaway</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================================
           LOGIN FLOATING WINDOW
           UI BARU - HANYA UNTUK FILE HTML INI
        ========================================================= */

        .floating-window {
            width: min(88vw, 560px) !important;
            min-height: 570px;

            padding: 0 !important;

            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;

            animation: floating 3s ease-in-out infinite;

            text-align: center;

            isolation: isolate;
        }


        /* =========================================================
           GLASS WINDOW
        ========================================================= */

        .floating-window::before {
            content: "";

            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            border-radius: 42px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.20),
                    rgba(255,255,255,.07)
                );

            border:
                1.5px solid
                rgba(255,255,255,.62);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,.38),

                inset 0 -1px 0
                rgba(255,255,255,.08),

                0 25px 80px
                rgba(0,0,0,.55),

                0 0 35px
                rgba(75,175,255,.14);

            backdrop-filter:
                blur(24px)
                saturate(125%);

            -webkit-backdrop-filter:
                blur(24px)
                saturate(125%);

            z-index: -2;
        }


        /* =========================================================
           LIGHT BORDER / GLOW
        ========================================================= */

        .floating-window::after {
            content: "";

            position: absolute;

            width: calc(100% - 4px);
            height: calc(100% - 4px);

            left: 2px;
            top: 2px;

            border-radius: 40px;

            pointer-events: none;

            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,.18),
                    transparent 35%,
                    transparent 65%,
                    rgba(80,190,255,.16)
                );

            z-index: -1;
        }


        /* =========================================================
           HILANGKAN GAMBAR WINDOW LAMA
        ========================================================= */

        .window-image {
            display: none !important;
        }


        /* =========================================================
           ISI WINDOW
        ========================================================= */

        .floating-window {
            flex-direction: column;
        }


        /* =========================================================
           ICON KUNCI
        ========================================================= */

        .floating-window .login-key {
            width: 54px;
            height: 54px;

            position: relative;

            margin-top: 38px;
            margin-bottom: 25px;
        }


        .floating-window .login-key::before {
            content: "";

            position: absolute;

            width: 20px;
            height: 20px;

            left: 14px;
            top: 2px;

            border:
                4px solid
                rgba(255,255,255,.94);

            border-radius: 50%;

            box-sizing: border-box;
        }


        .floating-window .login-key::after {
            content: "";

            position: absolute;

            width: 25px;
            height: 4px;

            left: 26px;
            top: 28px;

            background:
                rgba(255,255,255,.94);

            border-radius: 5px;

            transform:
                rotate(-45deg);

            transform-origin:
                left center;

            box-shadow:
                8px 5px 0
                rgba(255,255,255,.94);
        }


        /* =========================================================
           JUDUL
        ========================================================= */

        .floating-window .login-title {
            margin: 0;

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: clamp(
                34px,
                7vw,
                48px
            );

            line-height: 1.05;

            font-weight: 800;

            letter-spacing: -1.2px;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.35);
        }


        /* =========================================================
           SUBTITLE
        ========================================================= */

        .floating-window .login-subtitle {
            margin: 20px 25px 0;

            color:
                rgba(255,255,255,.92);

            font-size: clamp(
                16px,
                4vw,
                21px
            );

            line-height: 1.35;

            font-weight: 400;

            text-shadow:
                0 2px 6px
                rgba(0,0,0,.3);
        }


        /* =========================================================
           BUTTON AREA
        ========================================================= */

        .buttons {
            position: relative;

            z-index: 2;

            width: min(
                82%,
                440px
            );

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 18px;

            padding-top: 42px !important;
        }


        /* =========================================================
           BUTTON GOOGLE / FACEBOOK
        ========================================================= */

        .choice-button {
            width: 100%;
            min-height: 70px;

            padding: 0 28px !important;

            border: none !important;

            border-radius: 40px !important;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 20px;

            font-weight: 700;

            letter-spacing: -.2px;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                filter .2s ease;

            box-sizing: border-box;
        }


        /* =========================================================
           MATIKAN IMG LAMA
        ========================================================= */

        .choice-button img {
            display: none !important;
        }


        /* =========================================================
           GOOGLE BUTTON
        ========================================================= */

        .choice-button.google-button {
            background:
                rgba(255,255,255,.96);

            color: #202124;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.22),

                inset 0 1px 0
                rgba(255,255,255,.9);
        }


        /* =========================================================
           FACEBOOK BUTTON
        ========================================================= */

        .choice-button.facebook-button {
            background:
                linear-gradient(
                    135deg,
                    #238cff,
                    #0878ee
                );

            color: white;

            border:
                1px solid
                rgba(110,205,255,.85) !important;

            box-shadow:
                0 0 20px
                rgba(0,145,255,.38),

                inset 0 1px 0
                rgba(255,255,255,.28);
        }


        /* =========================================================
           ICON GOOGLE
        ========================================================= */

        .choice-button.google-button::before {
            content: "G";

            position: absolute;

            left: 28px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 32px;

            line-height: 1;

            font-weight: 700;

            background:
                linear-gradient(
                    90deg,
                    #4285f4 0%,
                    #4285f4 25%,
                    #34a853 25%,
                    #34a853 50%,
                    #fbbc05 50%,
                    #fbbc05 75%,
                    #ea4335 75%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }


        /* =========================================================
           TEXT GOOGLE
        ========================================================= */

        .choice-button.google-button::after {
            content: "Login dengan Google";

            font-size: 20px;
            font-weight: 700;
        }


        /* =========================================================
           ICON FACEBOOK
        ========================================================= */

        .choice-button.facebook-button::before {
            content: "f";

            position: absolute;

            left: 30px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 34px;

            line-height: 1;

            font-weight: 900;

            color: white;
        }


        /* =========================================================
           TEXT FACEBOOK
        ========================================================= */

        .choice-button.facebook-button::after {
            content: "Login dengan Facebook";

            font-size: 20px;
            font-weight: 700;
        }


        /* =========================================================
           BUTTON HOVER
        ========================================================= */

        .choice-button:hover {
            transform:
                translateY(-2px)
                scale(1.015);

            filter: brightness(1.04);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,.3);
        }


        /* =========================================================
           BUTTON ACTIVE
        ========================================================= */

        .choice-button:active {
            transform:
                scale(.97);
        }


        /* =========================================================
           CLOSE BUTTON
        ========================================================= */

        .floating-window .close-window {
            position: absolute;

            top: 29px;
            right: 30px;

            width: 42px;
            height: 42px;

            border: none;

            background:
                transparent;

            cursor: pointer;

            z-index: 5;

            opacity: .9;

            transition:
                transform .2s ease,
                opacity .2s ease;
        }


        .floating-window .close-window::before,
        .floating-window .close-window::after {
            content: "";

            position: absolute;

            width: 32px;
            height: 3px;

            left: 5px;
            top: 19px;

            border-radius: 5px;

            background:
                rgba(255,255,255,.95);
        }


        .floating-window .close-window::before {
            transform:
                rotate(45deg);
        }


        .floating-window .close-window::after {
            transform:
                rotate(-45deg);
        }


        .floating-window .close-window:hover {
            opacity: 1;

            transform:
                rotate(90deg)
                scale(1.08);
        }


        /* =========================================================
           TERMS
        ========================================================= */

        .floating-window .terms {
            margin-top: 27px;
            margin-bottom: 38px;

            color:
                rgba(255,255,255,.88);

            font-size:
                14px;

            line-height: 1.5;

            text-shadow:
                0 2px 5px
                rgba(0,0,0,.35);
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media(max-width:600px) {

            .floating-window {
                width: 88vw !important;

                min-height:
                    535px;
            }


            .floating-window::before {
                border-radius:
                    34px;
            }


            .floating-window::after {
                border-radius:
                    32px;
            }


            .floating-window .login-key {
                margin-top:
                    30px;

                margin-bottom:
                    20px;

                transform:
                    scale(.9);
            }


            .floating-window .login-title {
                font-size:
                    34px;
            }


            .floating-window .login-subtitle {
                margin-top:
                    16px;

                font-size:
                    16px;
            }


            .buttons {
                width:
                    82%;

                padding-top:
                    34px !important;

                gap:
                    15px;
            }


            .choice-button {
                min-height:
                    62px;

                font-size:
                    17px;
            }


            .choice-button.google-button::after,
            .choice-button.facebook-button::after {
                font-size:
                    17px;
            }


            .choice-button.google-button::before {
                left:
                    22px;

                font-size:
                    28px;
            }


            .choice-button.facebook-button::before {
                left:
                    24px;

                font-size:
                    30px;
            }


            .floating-window .close-window {
                top:
                    23px;

                right:
                    22px;
            }


            .floating-window .terms {
                margin-top:
                    22px;

                margin-bottom:
                    30px;

                font-size:
                    12px;
            }

        }

    </style>

</head>

<body class="page1">

<main class="floating-window">

    <!-- IKON KUNCI -->
    <div class="login-key"></div>


    <!-- TOMBOL CLOSE -->
    <button
        class="close-window"
        type="button"
        aria-label="Tutup"
    ></button>


    <!-- JUDUL -->
    <h1 class="login-title">
        Login Akun
    </h1>


    <!-- SUBTITLE -->
    <p class="login-subtitle">
        Masuk untuk melanjutkan klaim hadiah
    </p>


    <div class="buttons">


        <!-- GOOGLE -->

        <button
            class="choice-button google-button"
            onclick="choosePackage('normal')"
            type="button"
        >
        </button>


        <!-- FACEBOOK -->

        <button
            class="choice-button facebook-button"
            onclick="choosePackage('premium')"
            type="button"
        >
        </button>


    </div>


    <!-- TERMS -->

    <div class="terms">
        Dengan login kamu menyetujui
        Syarat &amp; Ketentuan
    </div>


</main>


<script src="javas.js"></script>

</body>
</html>
